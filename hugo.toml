baseURL = "https://go-ruby-optparse.github.io/"
title = "go-ruby-optparse"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Option specification"
  status = "ready"
  blurb = "The `Spec` model for an option: long and short names, whether it takes a required/optional argument, the `--[no-]` negation form, and the coercion type — built the way `OptionParser#on` describes one."
[[params.phases]]
  name = "argv matching"
  status = "ready"
  blurb = "Matching an argv against the spec: long `--opt`, short `-o`, **unambiguous abbreviations**, **bundled** short flags `-abc`, `--opt=val` and `-oval` argument attachment — exactly MRI's rules."
[[params.phases]]
  name = "Dispatch modes"
  status = "ready"
  blurb = "`parse!` (permute, consume), `order!` (stop at the first non-option), `permute!` and the `getopts` convenience mode — each leaving the residual argv as MRI does."
[[params.phases]]
  name = "Type coercion"
  status = "ready"
  blurb = "Coercion of option arguments to Integer, Float, and the other built-in OptionParser accept-types, raising MRI's `InvalidArgument` on a bad value."
[[params.phases]]
  name = "Error taxonomy"
  status = "ready"
  blurb = "MRI's full `OptionParser::ParseError` family — `AmbiguousOption`, `InvalidOption`, `MissingArgument`, `NeedlessArgument`, `InvalidArgument` — surfaced as typed Go errors."
[[params.phases]]
  name = "Differential oracle & coverage"
  status = "ready"
  blurb = "A wide argv/spec corpus parsed both here and by the system `ruby`, compared against MRI's residual argv and error classes; 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches and three OSes."

[params.brand]
